crs:
  projected: "EPSG:8857"  # WGS 84 / Equal Earth Greenwich

# Settings per powerplant category
category:
  # Technology mappings allow you to rename and combine powerplant subtypes.
  bioenergy:
    technology_mapping:
      "unknown": "bioenergy turbine"

  fossil:
    technology_mapping:
      coal:
        CFB: "coal turbine"
        IGCC: "igcc"
        subcritical: "coal turbine"
        supercritical: "coal turbine"
        ultra-supercritical: "coal turbine"
        unknown: "coal turbine"
      oil_gas:
        AFC: "ccgt"
        ICCC: "ccgt"
        IGCC: "igcc"
        ISCC: "ccgt"
        combined cycle: "ccgt"
        gas turbine: "ocgt"
        internal combustion: "reciprocating engine"
        steam turbine: "ocgt"
        unknown: "ocgt"

  geothermal:
    technology_mapping:
      "advanced geothermal systems (AGS)": "geothermal"
      "binary cycle": "geothermal"
      "dry steam": "geothermal"
      "enhanced geothermal systems (EGS)": "geothermal"
      "flash steam - double": "geothermal"
      "flash steam - single": "geothermal"
      "flash steam - triple": "geothermal"
      "flash steam - unknown": "geothermal"
      "geopressured geothermal system (GGS)": "geothermal"
      "unknown": "geothermal"

  hydropower:
    technology_mapping:
      Canal: "run of river"
      PS: "pumped storage"
      ROR: "run of river"
      STO: "reservoir"
      unknown: "reservoir"

  nuclear:
    technology_mapping:
      advanced boiling water reactor: "nuclear reactor"
      boiling water reactor: "nuclear reactor"
      fast breeder reactor: "nuclear reactor"
      fast neutron reactor: "nuclear reactor"
      gas-cooled reactor: "nuclear reactor"
      heavy water gas-cooled reactor: "nuclear reactor"
      heavy water light water reactor: "nuclear reactor"
      high temperature gas reactor: "nuclear reactor"
      light water graphite reactor: "nuclear reactor"
      liquid-metal-cooled fast reactor: "nuclear reactor"
      microreactor: "nuclear reactor"
      molten salt reactor: "nuclear reactor"
      pressurized heavy water reactor: "nuclear reactor"
      pressurized water reactor: "nuclear reactor"
      small modular reactor: "smr reactor"
      steam-generating heavy water reactor: "nuclear reactor"
      unknown: "nuclear reactor"

  solar:
    technology_mapping:
      csp: "concentrating solar power"
      rooftop_pv: "rooftop pv"
      utility_pv: "utility pv"
    dc_ac_ratio:
      # Typical rule of thumb ratio. See https://doi.org/10.1016/j.apenergy.2016.05.134
      utility_pv: 1.25

  wind:
    source: "gem" # options: wemi, gem
    technology_mapping:
      offshore: "offshore"
      onshore: "onshore"

# Optional configuration to rename and combine fuels.
# The module already provides a default mapping, seen in the link below.
# https://github.com/modelblocks-org/module_powerplants/blob/main/workflow/internal/settings.yaml
fuel_mapping:
  "bioenergy: unknown": "biomass"
  "coal: unknown": "brown coal"
  "fossil gas: unknown": "natural gas"

# Assumptions and gap filling settings
imputation:
  # Assumptions related to powerplant location
  location:
    # If true, clean up input shapes to remove overlaps
    # keep false if your input shapes are already correct
    remove_shape_overlaps: false
    # Minimum distance from polygon borders to use when adjusting powerplant location.
    inner_distance: 100  # 100 metres (matches the projected CRS unit).
    # How to handle powerplants belonging to two polygons.
    on_overlap: "raise"  # either 'split_capacity', or 'raise'
    # You can optionally assign powerplants to be landor maritime based.
    # The module will adjust their position using a simple algorithm
    shape_class:
      bioenergy turbine: "land"
      ccgt: "land"
      coal turbine: "land"
      concentrating solar power: "land"
      geothermal: "land"
      igcc: "land"
      nuclear reactor: "land"
      ocgt: "land"
      offshore: "maritime"
      onshore: "land"
      pumped storage: "land"
      reciprocating engine: "land"
      reservoir: "land"
      run of river: "land"
      utility pv: "land"
    on_shape_class_error: "drop"  # either 'drop', 'ignore', or 'raise'

  # Assumptions related to powerplant (de)comissioning
  time:
    # Which future projects to include
    scenario: "construction" # Options: historical->construction->pre_construction->announced
    method: capacity_profile
    lifetime_years:
      # Lifetime assumption to use when a plant's (de)comissioning date is unknown
      bioenergy turbine: 25
      ccgt: 20
      coal turbine: 50
      concentrating solar power: 25
      geothermal: 30
      igcc: 25
      nuclear reactor: 50
      ocgt: 20
      offshore: 27
      onshore: 27
      pumped storage: 100
      reciprocating engine: 20
      reservoir: 100
      rooftop pv: 30
      run of river: 100
      smr reactor: 50
      utility pv: 25
    retirement_delay_years:
      # Assumed extension past reference year.
      # Only applies if a powerplant is still operating past the lifetime_years assumption
      bioenergy turbine: 5
      ccgt: 5
      coal turbine: 5
      concentrating solar power: 2
      geothermal: 5
      igcc: 5
      nuclear reactor: 5
      ocgt: 5
      offshore: 2
      onshore: 2
      pumped storage: 10
      reciprocating engine: 5
      reservoir: 10
      rooftop pv: 5
      run of river: 10
      smr reactor: 50
      utility pv: 2
    # Comissioning window to use for future projects with unknown comissioning dates.
    # Defined in relation to the module's dataset year (2024)
    # Example: [2, 6) -> may be placed from 2026 and before 2030
    planned_commissioning_year_windows:
      bioenergy turbine:
        construction: [1, 3]
        pre-construction: [2, 5]
        announced: [4, 8]
      ccgt:
        construction: [1, 3]
        pre-construction: [2, 5]
        announced: [4, 8]
      coal turbine:
        construction: [1, 3]
        pre-construction: [2, 5]
        announced: [4, 8]
      concentrating solar power:
        construction: [1, 4]
        pre-construction: [3, 7]
        announced: [5, 10]
      geothermal:
        construction: [2, 5]
        pre-construction: [3, 7]
        announced: [5, 10]
      igcc:
        construction: [2, 5]
        pre-construction: [4, 8]
        announced: [6, 12]
      nuclear reactor:
        construction: [3, 7]
        pre-construction: [5, 13]
        announced: [8, 18]
      ocgt:
        construction: [1, 3]
        pre-construction: [2, 5]
        announced: [4, 8]
      offshore:
        construction: [2, 5]
        pre-construction: [3, 8]
        announced: [5, 12]
      onshore:
        construction: [1, 3]
        pre-construction: [2, 6]
        announced: [3, 10]
      pumped storage:
        construction: [3, 8]
        pre-construction: [5, 12]
        announced: [8, 18]
      reciprocating engine:
        construction: [1, 3]
        pre-construction: [2, 5]
        announced: [4, 8]
      reservoir:
        construction: [3, 8]
        pre-construction: [5, 12]
        announced: [8, 18]
      rooftop pv:
        construction: [1, 2]
        pre-construction: [2, 3]
        announced: [3, 5]
      run of river:
        construction: [2, 6]
        pre-construction: [4, 10]
        announced: [6, 15]
      smr reactor:
        construction: [2, 6]
        pre-construction: [4, 10]
        announced: [7, 15]
      utility pv:
        construction: [1, 3]
        pre-construction: [2, 5]
        announced: [3, 8]
